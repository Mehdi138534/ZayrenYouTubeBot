name: Zayren YouTube Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_latest:
        description: "آخرین ویدیوی لانگ و شورت را دوباره بفرست"
        type: boolean
        default: false
      force_intro:
        description: "پیام معرفی بات را دوباره بفرست"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: zayren-youtube-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FORCE_LATEST: ${{ github.event.inputs.force_latest }}
          FORCE_INTRO: ${{ github.event.inputs.force_intro }}
        run: python bot.py

      - name: Save bot state
        if: always()
        run: |
          if [ -f bot_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bot_state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update bot state [skip ci]"
              git pull --rebase origin "${GITHUB_REF_NAME}" || true
              git push
            fi
          fi
